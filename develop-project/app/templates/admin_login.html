<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin-login-body">
  <main class="login-shell">
    <section class="login-panel">
      <div class="login-brand">
        <img src="/static/images/logo.png" alt="Medical Chatbot">
        <div>
          <h1>Admin</h1>
          <p>Quan ly du lieu GraphRAG</p>
        </div>
      </div>

      {% if error %}
      <div class="alert alert-danger py-2">Dang nhap khong thanh cong.</div>
      {% endif %}

      <form method="post" action="/admin/login" class="login-form">
        <label class="form-label" for="username">User</label>
        <input class="form-control" id="username" name="username" autocomplete="username" required>

        <label class="form-label mt-3" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>

        <button class="btn btn-primary w-100 mt-4" type="submit">Dang nhap</button>
      </form>
    </section>
  </main>
</body>
</html>
